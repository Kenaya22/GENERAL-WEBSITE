<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wrong turn — Hari ng Kalsada</title>
  <meta name="theme-color" content="#1c0a0f" />
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center;
      background: radial-gradient(80% 60% at 50% 100%, #5e2131, #1c0a0f 70%); color: #fbf7f0;
      font-family: "Bodoni Moda", Georgia, serif; }
    svg { width: 48px; height: 48px; color: #e4b45c; margin: 0 auto 20px; display: block; }
    h1 { font-weight: 500; font-size: clamp(2rem, 8vw, 3.4rem); margin: 0 0 12px; }
    h1 em { color: #e4b45c; }
    p { font-family: system-ui, sans-serif; color: rgba(251,247,240,.7); max-width: 34ch; margin: 0 auto 28px; line-height: 1.55; }
    button { font: 600 11px/1 system-ui, sans-serif; letter-spacing: .18em; text-transform: uppercase; padding: 18px 28px;
      border-radius: 999px; border: 0; background: #e4b45c; color: #12060a; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18l-1.6-10.2-4.9 4.3L12 5l-2.5 7.1-4.9-4.3L3 18z" fill="currentColor"/><rect x="3" y="19.5" width="18" height="1.8" rx=".9" fill="currentColor"/></svg>
    <h1>Wrong <em>turn.</em></h1>
    <p>This road doesn't exist. Let's get you back on the highway.</p>
    <button onclick="location.href=location.pathname.split('/').length>2?'/'+location.pathname.split('/')[1]+'/':'/'">Back to home</button>
  </main>
</body>
</html>
