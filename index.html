  <!-- Launch: loading screen, then the creator page (K & A Studios), then the app -->
  <div class="splash" id="splash" role="presentation">
    <div class="splash__stage splash__load">
      <svg class="splash__logo" aria-hidden="true"><use href="#i-logo"/></svg>
      <h1 class="splash__name">Tara</h1>
      <p class="splash__tag">Your Philippine travel buddy</p>
      <span class="road-loader road-loader--lg splash__road" aria-hidden="true"><i></i></span>
      <p class="splash__hint">Loading your trips…</p>
    </div>
    <div class="splash__stage splash__studio">
      <svg class="studio-mark" aria-hidden="true"><use href="#i-ka"/></svg>
      <p class="studio-name">K &amp; A Studios</p>
      <p class="studio-sub">presents</p>
      <p class="studio-app"><svg aria-hidden="true"><use href="#i-logo"/></svg>Tara</p>
      <p class="studio-skip">Tap to continue</p>
    </div>
  </div>

  <div class="app" id="app">
    <!-- Desktop sidebar / Mobile tab bar share the same nav -->
    <nav class="nav" id="nav" aria-label="Main">
      <a class="nav__brand" href="#/home" aria-label="Tara home">
        <svg class="logo" aria-hidden="true"><use href="#i-logo"/></svg>
        <span><strong>Tara</strong><small>Travel buddy</small></span>
      </a>
      <a class="nav__item" href="#/home" data-nav="home">
        <svg class="i" aria-hidden="true"><use href="#i-home"/></svg><span>Home</span>
      </a>
      <a class="nav__item" href="#/explore" data-nav="explore">
        <svg class="i" aria-hidden="true"><use href="#i-compass"/></svg><span>Explore</span>
      </a>
      <a class="nav__item nav__item--plan" href="#/plan" data-nav="plan">
        <span class="nav__fab"><svg class="i" aria-hidden="true"><use href="#i-route"/></svg></span><span>Plan</span>
      </a>
      <a class="nav__item" href="#/trips" data-nav="trips">
        <svg class="i" aria-hidden="true"><use href="#i-ticket"/></svg><span>Trips</span>
        <span class="nav__badge" data-trips-badge hidden></span>
      </a>
      <a class="nav__item" href="#/profile" data-nav="profile">
        <svg class="i" aria-hidden="true"><use href="#i-user"/></svg><span>Profile</span>
      </a>
      <button class="nav__install install-btn" type="button" data-action="install">
        <svg class="i" aria-hidden="true"><use href="#i-download"/></svg><span>Install app</span>
      </button>
    </nav>

    <main class="view" id="view" tabindex="-1"></main>
  </div>

  <!-- Sheet (modal / slide-over) -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet__backdrop" data-action="close-sheet"></div>
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
      <div class="sheet__handle" aria-hidden="true"><span></span></div>
      <header class="sheet__head">
        <h2 class="sheet__title" id="sheet-title"></h2>
        <button class="icon-btn" type="button" data-action="close-sheet" aria-label="Close"><svg class="i" aria-hidden="true"><use href="#i-close"/></svg></button>
      </header>
      <div class="sheet__body"></div>
    </div>
  </div>

  <div class="toasts" aria-live="polite"></div>
  <noscript><p style="padding:2rem;text-align:center">Tara needs JavaScript turned on.</p></noscript>

  <script src="vendor/leaflet/leaflet.js"></script>

  <script src="js/core.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/services.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/views.js"></script>
  <script src="js/engage.js"></script>
  <script src="js/extras.js"></script>
  <script src="js/guide.js"></script>
  <script src="js/assistant.js"></script>
  <script src="js/main.js"></script>
</body>
